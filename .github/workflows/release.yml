# Builds the module when a GitHub release is published.
# Tag the release with the version, e.g. v1.0.1. The workflow writes that version
# and the matching download link into module.json, zips the module, and attaches
# module.json + module.zip to the release so Foundry can install and update it.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version and download link
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.zip"
          jq --arg v "$VERSION" --arg d "$DOWNLOAD" '.version = $v | .download = $d' module.json > module.tmp
          mv module.tmp module.json

      - name: Build zip
        run: zip -r module.zip module.json README.md scripts styles

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber
